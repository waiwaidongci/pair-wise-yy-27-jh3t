<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>数字人文文本校勘 · 封存与授权移交</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f7f5ef}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #d6d0c4;border-radius:10px}h2{margin-top:0}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}button{background:#5b3d22;color:#fff;cursor:pointer}button.sec{background:#6b4d32}pre{white-space:pre-wrap;max-height:420px;overflow:auto;background:#faf8f2;padding:8px;border-radius:6px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea,.grid select{width:90%}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px}.bar input{width:130px}.muted{color:#777;font-size:13px}</style><h1>数字人文文本校勘 · 封存与授权移交闭环</h1><p class="muted">打开页面即可完成封存、转交、修订确认与历史查阅。封存留存异文、注释与对齐快照；封存后注释仍可补录，已交付内容不可改动；修改封存依据后旧封存立即失效，导出与缺口统计按新依据重算；未确认修订不混入交付稿。</p><section><button onclick="state()">刷新状态</button><pre id="state"></pre></section><section><h2>封存段落</h2><div class="bar"><input id="seal_passage" type="number" placeholder="段落 ID"><input id="seal_user" type="number" placeholder="负责人 ID"><input id="seal_reason" placeholder="封存理由，如：定稿"><button onclick="seal()">封存并留存快照</button></div><pre id="seal_out"></pre></section><section><h2>负责人转交作品</h2><div class="bar"><input id="ho_work" type="number" placeholder="作品 ID"><input id="ho_from" type="number" placeholder="原负责人 ID"><input id="ho_to" type="number" placeholder="接手人 ID"><button onclick="handover()">转交（幂等提交）</button></div><p class="muted">接手人须具备审阅权限或为版本编辑；权限不符拒绝转交。同幂等键并发提交只成功一次。</p><pre id="ho_out"></pre></section><section><h2>修订确认</h2><div class="bar"><input id="cf_variant" type="number" placeholder="异文 ID"><input id="cf_rev" type="number" placeholder="当前修订号"><input id="cf_user" type="number" placeholder="负责人 ID"><button onclick="confirmRev()">确认修订（幂等提交）</button></div><p class="muted">未确认修订不进入交付稿；同一修订并发确认只成功一次。</p><pre id="cf_out"></pre></section><section><h2>修改封存依据</h2><div class="bar"><input id="bs_passage" type="number" placeholder="段落 ID"><input id="bs_user" type="number" placeholder="负责人 ID"><textarea id="bs_text" placeholder="新底本"></textarea><button onclick="updateBasis()">修改底本依据</button></div><div class="bar"><input id="al_passage" type="number" placeholder="段落 ID"><input id="al_witness" type="number" placeholder="版本 ID"><input id="al_user" type="number" placeholder="编辑 ID"><input id="al_order" type="number" value="1" style="width:80px"><textarea id="al_text" placeholder="新对齐文本"></textarea><button onclick="updateAlign()">改定对齐依据</button></div><p class="muted">修改底本或对齐后，旧封存立即失效，导出与缺口统计按新依据重算。</p><pre id="bs_out"></pre></section><section><h2>查阅历史</h2><div class="bar"><input id="hi_work" type="number" placeholder="作品 ID"><input id="hi_user" type="number" placeholder="用户 ID"><button onclick="listSeals()">封存历史</button><button onclick="listHandovers()">转交历史</button></div><div class="bar"><input id="hi_passage" type="number" placeholder="段落 ID"><button onclick="passageHistory()">段落修订/封存/确认历史</button></div><pre id="hi_out"></pre></section><section><h2>段落与版本对齐</h2><div class="grid"><input id="work" type="number" placeholder="作品 ID"><input id="passage" type="number" placeholder="段落 ID"><input id="witness" type="number" placeholder="版本 ID"><input id="user" type="number" placeholder="用户 ID"><input id="order" type="number" value="1"><textarea id="text" placeholder="对齐文本">春水东流，[缺页]</textarea></div><button onclick="align()">保存对齐</button><pre id="result"></pre></section><section><h2>异文多层修订</h2><input id="variant" type="number" placeholder="异文 ID"><input id="revision" type="number" value="0" placeholder="当前修订"><input id="reason" placeholder="取舍理由"><textarea id="proposed" placeholder="拟订文本"></textarea><button onclick="variant()">新增异文</button><button onclick="revise()">提交新层</button><button onclick="snapshot()">查看快照</button><button onclick="lock()">锁定段落</button><pre id="extra"></pre></section><section><h2>校勘稿导出</h2><div class="bar"><input id="ex_work" type="number" placeholder="作品 ID"><input id="ex_user" type="number" placeholder="用户 ID"><button onclick="exportCollation()">导出校勘稿</button></div><pre id="ex_out"></pre></section><script>const show=(e,x)=>document.querySelector(e).textContent=JSON.stringify(x,null,2);const rid=()=>(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());async function get(u,e='#result'){show(e,await(await fetch(u)).json())}async function post(u,b,e='#result'){show(e,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}async function state(){show('#state',await(await fetch('/api/state')).json())}function align(){post('/api/alignments',{passage_id:+passage.value,witness_id:+witness.value,aligned_text:text.value,sort_order:+order.value,user_id:+user.value})}function variant(){post('/api/variants',{passage_id:+passage.value,witness_id:+witness.value,proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value})}function revise(){post('/api/variants/'+variant.value+'/revisions',{proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value},'#extra')}function snapshot(){get('/api/passages/'+passage.value+'/snapshots/'+revision.value+'?user_id='+user.value,'#extra')}function lock(){post('/api/passages/'+passage.value+'/lock',{user_id:+user.value,reason:'版本已定稿'},'#extra')}function seal(){post('/api/passages/'+seal_passage.value+'/seal',{user_id:+seal_user.value,reason:seal_reason.value||'定稿封存'},'#seal_out')}function handover(){post('/api/works/'+ho_work.value+'/handovers',{from_user_id:+ho_from.value,to_user_id:+ho_to.value,idempotency_key:rid()},'#ho_out')}function confirmRev(){post('/api/variants/'+cf_variant.value+'/confirm',{revision_no:+cf_rev.value,user_id:+cf_user.value,idempotency_key:rid()},'#cf_out')}function updateBasis(){post('/api/passages/'+bs_passage.value+'/basis',{base_text:bs_text.value,user_id:+bs_user.value},'#bs_out')}function updateAlign(){post('/api/alignments/update',{passage_id:+al_passage.value,witness_id:+al_witness.value,aligned_text:al_text.value,sort_order:+al_order.value,user_id:+al_user.value},'#bs_out')}function listSeals(){get('/api/works/'+hi_work.value+'/seals?user_id='+hi_user.value,'#hi_out')}function listHandovers(){get('/api/works/'+hi_work.value+'/handovers?user_id='+hi_user.value,'#hi_out')}function passageHistory(){get('/api/passages/'+hi_passage.value+'/history?user_id='+hi_user.value,'#hi_out')}function exportCollation(){get('/api/works/'+ex_work.value+'/collation?user_id='+ex_user.value,'#ex_out')}state()</script></html>
